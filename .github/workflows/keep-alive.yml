name: Health Check Cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Ping Services
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -s -f -m 30 "https://k12-hunar-backend-487b.onrender.com/api/health" || true

      - name: Ping Frontend
        run: |
          curl -s -f -m 30 "https://full-stack-assessment-task-ed-tech.vercel.app" || true
